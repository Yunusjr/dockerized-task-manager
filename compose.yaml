services:
  web:
    build: .
    container_name: task-manager-web
    ports:
      - "8085:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_NAME: task_manager
      DB_USER: task_app
      DB_PASSWORD: root_dev_password

  database:
    image: mysql:8.4
    container_name: task-manager-db
    restart: unless-stopped
    ports:	
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_password"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data: